spring:
  application:
    name: coffee-duty
  datasource:
    url: jdbc:h2:file:./data/coffee-duty;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

app:
  zone: Asia/Seoul
  cors:
    allowed-origins: http://localhost:3000
